<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tire Quiz Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0f14;
    --card: #121821;
    --card-edge: #1e2836;
    --text: #e8eef5;
    --muted: #8b98a8;
    --accent: #3ddc84;
    --accent-glow: rgba(61, 220, 132, 0.35);
    --wrong: #ff5c6c;
    --wrong-glow: rgba(255, 92, 108, 0.3);
    --tire: #1b2531;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 36px 16px 56px;
    background-image:
      radial-gradient(ellipse 640px 320px at 50% -60px, rgba(61, 220, 132, 0.09), transparent),
      radial-gradient(ellipse 520px 420px at 95% 105%, rgba(42, 53, 66, 0.45), transparent);
    background-attachment: fixed;
  }

  .app { width: 100%; max-width: 560px; }

  header { text-align: center; margin-bottom: 30px; }

  .tire-icon {
    font-size: 2.6rem;
    filter: drop-shadow(0 0 14px var(--accent-glow));
  }

  h1 {
    font-size: 1.8rem;
    letter-spacing: 1.5px;
    margin-top: 8px;
    background: linear-gradient(90deg, var(--text), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .tagline { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }

  section {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 10px 34px rgba(0,0,0,0.4);
  }

  .section-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-edge);
  }

  /* ---- Question area ---- */
  #question-text { font-size: 1.15rem; font-weight: 600; line-height: 1.55; margin-bottom: 18px; }

  .answer-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--tire);
    color: var(--text);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    font-size: 0.98rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .answer-btn:hover:not(:disabled) {
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
    transform: translateY(-1px);
  }

  .answer-btn:disabled { cursor: default; }

  .answer-btn.correct {
    background: rgba(61, 220, 132, 0.14);
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
    font-weight: 600;
  }

  .answer-btn.wrong {
    background: rgba(255, 92, 108, 0.12);
    border-color: var(--wrong);
    box-shadow: 0 0 10px var(--wrong-glow);
  }

  .answer-btn.dim { opacity: 0.45; }

  #feedback { min-height: 1.5em; font-size: 0.92rem; font-weight: 600; line-height: 1.5; }
  #feedback.good { color: var(--accent); text-shadow: 0 0 8px var(--accent-glow); }
  #feedback.bad { color: var(--wrong); }

  #next-btn {
    display: none;
    margin-top: 14px;
    background: var(--accent);
    color: #06210f;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 0 16px var(--accent-glow);
    transition: all 0.15s ease;
  }
  #next-btn:hover { transform: translateY(-1px); box-shadow: 0 0 22px var(--accent-glow); }

  /* ---- Score area ---- */
  .score-row { display: flex; gap: 12px; }
  .stat {
    flex: 1;
    background: var(--tire);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    border: 1px solid var(--card-edge);
  }
  .stat .num {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent-glow);
    transition: transform 0.15s ease;
  }
  .stat .num.bump { transform: scale(1.35); }
  .stat .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

  .progress-track { margin-top: 16px; height: 8px; background: var(--tire); border-radius: 4px; overflow: hidden; }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), #7ff0b0);
    border-radius: 4px;
    transition: width 0.35s ease;
    box-shadow: 0 0 8px var(--accent-glow);
  }

  /* ---- Game over area ---- */
  #gameover { text-align: center; }
  #final-score {
    font-size: 2.6rem;
    font-weight: 800;
    color: var(--accent);
    text-shadow: 0 0 22px var(--accent-glow);
  }
  #result-msg { color: var(--muted); margin: 10px 0 20px; font-size: 1rem; line-height: 1.5; }
  #restart-btn {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 12px 32px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  #restart-btn:hover { background: var(--accent); color: #06210f; box-shadow: 0 0 18px var(--accent-glow); }

  footer { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="tire-icon">🛞</div>
    <h1>Tire Quiz Game</h1>
    <p class="tagline">Quick tire questions with a Malaysian twist — sample data only</p>
  </header>

  <!-- Section 1: Question area -->
  <section id="question-section">
    <div class="section-label">Question</div>
    <p id="question-text"></p>
    <div id="answers"></div>
    <p id="feedback"></p>
    <button id="next-btn">Next Question →</button>
  </section>

  <!-- Section 2: Score area -->
  <section id="score-section">
    <div class="section-label">Score</div>
    <div class="score-row">
      <div class="stat"><div class="num" id="stat-score">0</div><div class="lbl">Score</div></div>
      <div class="stat"><div class="num" id="stat-answered">0</div><div class="lbl">Answered</div></div>
      <div class="stat"><div class="num" id="stat-left">0</div><div class="lbl">Left</div></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </section>

  <!-- Section 3: Game over area -->
  <section id="gameover">
    <div class="section-label">Game Over</div>
    <div id="final-score">0 / 0</div>
    <p id="result-msg">Finish all questions to see your final result here.</p>
    <button id="restart-btn">↻ Restart Quiz</button>
  </section>

  <footer>Tire Quiz Game · Fictional sample questions · Nothing is saved between visits</footer>
</div>

<script>
  // ---- Sample questions (made up, tire-themed, Malaysia-specific) ----
  const QUESTIONS = [
    {
      q: "In Malaysia, what is the legal minimum tire tread depth for a passenger car?",
      answers: ["1.0 mm", "1.6 mm", "3.0 mm"],
      correct: 1
    },
    {
      q: "Which Malaysian expressway runs from Bukit Kayu Hitam in the north all the way to Johor Bahru in the south?",
      answers: ["MEX Highway", "Duke Highway", "PLUS North-South Expressway"],
      correct: 2
    },
    {
      q: "Why should Malaysian drivers check tire pressure more often on hot afternoons?",
      answers: ["Heat raises the air pressure inside the tire", "Paint on the rim fades faster", "Roads become more slippery for tires"],
      correct: 0
    },
    {
      q: "What does the load index number on a tire's sidewall tell you?",
      answers: ["The maximum speed of the tire", "The tire's width in millimetres", "The maximum weight each tire can carry"],
      correct: 2
    },
    {
      q: "Roughly how often should you rotate your car's tires for even wear?",
      answers: ["Every 10,000 km or so", "Once every five years", "Only when they look flat"],
      correct: 0
    }
  ];

  const el = id => document.getElementById(id);

  let current = 0, score = 0, answered = 0, locked = false;

  function renderStats(bumpScore) {
    const scoreEl = el('stat-score');
    scoreEl.textContent = score;
    el('stat-answered').textContent = answered;
    el('stat-left').textContent = QUESTIONS.length - answered;
    el('progress-fill').style.width = (answered / QUESTIONS.length * 100) + '%';
    if (bumpScore) {
      scoreEl.classList.remove('bump');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('bump');
      setTimeout(() => scoreEl.classList.remove('bump'), 200);
    }
  }

  // FEATURE: app opens with the first question already showing — never empty
  function renderQuestion() {
    locked = false;
    const item = QUESTIONS[current];
    el('question-text').textContent = `Q${current + 1} of ${QUESTIONS.length}. ${item.q}`;
    const fb = el('feedback');
    fb.textContent = '';
    fb.className = '';
    el('next-btn').style.display = 'none';

    const box = el('answers');
    box.innerHTML = '';
    item.answers.forEach((text, i) => {
      const btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = text;
      btn.onclick = () => pick(i, btn);
      box.appendChild(btn);
    });
  }

  // FEATURE 1 + 2: immediate right/wrong feedback and instant score update
  function pick(i, btn) {
    if (locked) return;
    locked = true;
    answered++;
    const item = QUESTIONS[current];
    const buttons = [...el('answers').children];
    buttons.forEach(b => b.disabled = true);

    const fb = el('feedback');
    if (i === item.correct) {
      score++;
      btn.classList.add('correct');
      fb.textContent = '✅ Correct! Nice tire knowledge.';
      fb.className = 'good';
      renderStats(true);
    } else {
      btn.classList.add('wrong');
      buttons[item.correct].classList.add('correct');
      buttons.forEach(b => { if (b !== btn) b.classList.add('dim'); });
      fb.textContent = '❌ Wrong — the highlighted answer was correct.';
      fb.className = 'bad';
      renderStats(false);
    }

    if (answered < QUESTIONS.length) {
      el('next-btn').style.display = 'inline-block';
    } else {
      setTimeout(gameOver, 800);
    }
  }

  el('next-btn').onclick = () => {
    current++;
    renderQuestion();
  };

  // Section 3 becomes live when the last question is answered
  function gameOver() {
    const pct = score / QUESTIONS.length;
    let msg;
    if (pct === 1)      msg = '🏆 Perfect round! You are a tire legend on Malaysian roads.';
    else if (pct >= 0.6) msg = '👍 Solid driving! Your tire game is strong.';
    else if (pct >= 0.4) msg = '🔧 Not bad — one more pit stop and you will ace it.';
    else                msg = '🛞 Time for a tire refresher. Try another round!';
    el('final-score').textContent = `${score} / ${QUESTIONS.length}`;
    el('result-msg').textContent = msg;
    el('gameover').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // FEATURE 3: restart resets everything back to the first question
  el('restart-btn').onclick = () => {
    current = 0; score = 0; answered = 0; locked = false;
    renderQuestion();
    renderStats(false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // Boot — app is never empty
  renderQuestion();
  renderStats(false);
</script>
</body>
</html>
